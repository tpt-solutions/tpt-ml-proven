version: 2
updates:
  # The five lockfile directories.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/ffi/c"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/ffi/python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/ffi/wasm"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/tools/tptc-verify"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/ffi/python"
    schedule:
      interval: "weekly"
