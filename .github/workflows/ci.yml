name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # The core crate must build without std, on a bare-metal target (no_std + alloc).
  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p tpt-ml-proven-core --no-default-features --target thumbv6m-none-eabi

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p tpt-ml-proven-core --no-default-features --target wasm32-unknown-unknown

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Solver-verifies every .tptc contract and runs the verifier's own tests.
  # tools/tptc-verify is excluded from the runtime workspace and pins tpt-solver by git rev.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/tptc-verify
      - run: cargo test --manifest-path tools/tptc-verify/Cargo.toml
      - run: cargo run --manifest-path tools/tptc-verify/Cargo.toml -- docs/contracts

  # Python wheel built with maturin (abi3, Python 3.9+), installed into a fresh
  # venv with no C compiler involved, then tested. Runs on all three OSes.
  python-bindings:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ffi/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi/python
      - run: python -m pip install maturin numpy pytest
      - run: maturin build --release --out dist
      - run: python -m pip install --force-reinstall dist/*.whl
        shell: bash
      - run: python -m pytest -q tests
        working-directory: ffi/python

  # WebAssembly build with wasm-pack, tested under Node.
  wasm-bindings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ffi/wasm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build --target nodejs --release --no-opt --out-dir pkg
      - run: node --test tests/bindings.test.mjs

  # C ABI tests, and a check that the committed header matches the Rust source.
  c-abi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ffi/c
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi/c
      - run: cargo test
      - run: cargo install cbindgen --locked
      - run: cbindgen --config cbindgen.toml --crate tpt-ml-proven-c --output include/tpt_ml_proven.h
      - run: git diff --exit-code -- include/tpt_ml_proven.h

  # KMeans benchmark against scikit-learn, as a report only: it never fails the build, and the
  # numbers depend on the runner. Results go to the job summary and an uploaded artifact.
  benchmark:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install numpy scikit-learn==1.9.0 threadpoolctl
      - name: Time scikit-learn
        run: |
          mkdir -p target/bench
          python tools/parity/bench_kmeans.py > target/bench/sklearn.json
      - name: Time tpt-ml-proven
        run: |
          cargo run --release -p tpt-ml-proven-clustering --example bench_kmeans --features parallel -- \
            target/bench/kmeans_1000000x50_f32.bin 1000000 50 8 20 1,$(nproc) | tee target/bench/tpt-ml-proven.txt
      - name: Summary
        run: |
          {
            echo "## KMeans benchmark (report only)"
            echo
            echo "### scikit-learn"
            echo '```json'
            cat target/bench/sklearn.json
            echo '```'
            echo
            echo "### tpt-ml-proven"
            echo '```'
            cat target/bench/tpt-ml-proven.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kmeans-benchmark
          path: target/bench/*.json

  # Go package over the C ABI. Linux only here: cgo links the Rust static library built by cargo.
  go-bindings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ffi/go
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi/c
      - uses: actions/setup-go@v6
        with:
          go-version: "1.21"
      - run: cargo build --release --manifest-path ../c/Cargo.toml
      - run: go vet ./...
      - run: go test -count=1 ./...
