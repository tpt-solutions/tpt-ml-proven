# WebAssembly bindings (wasm-bindgen). Standalone workspace, so wasm tooling never
# enters the runtime build of the library crates.
[package]
name = "tpt-ml-proven-wasm"
description = "WebAssembly bindings for tpt-ml-proven: clustering, decomposition, linear models, ensembles, trees and preprocessing."
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
publish = false
rust-version = "1.85"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
tpt-ml-proven-core = { path = "../../crates/tpt-ml-proven-core" }
tpt-ml-proven-clustering = { path = "../../crates/tpt-ml-proven-clustering" }
tpt-ml-proven-decomposition = { path = "../../crates/tpt-ml-proven-decomposition" }
tpt-ml-proven-linear = { path = "../../crates/tpt-ml-proven-linear" }
tpt-ml-proven-ensemble = { path = "../../crates/tpt-ml-proven-ensemble" }
tpt-ml-proven-preprocessing = { path = "../../crates/tpt-ml-proven-preprocessing" }
tpt-ml-proven-trees = { path = "../../crates/tpt-ml-proven-trees" }
