<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tpt-ml-proven in the browser</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; color: #1d1d1f; }
    canvas { border: 1px solid #c7c7cc; border-radius: 6px; max-width: 100%; }
    code { background: #f2f2f7; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>KMeans in the browser</h1>
  <p>Random points are clustered with <code>KMeansModel</code>, which runs as WebAssembly. Press the button for new points.</p>
  <p><label>Clusters <input id="k" type="number" min="1" max="8" value="3"></label>
     <button id="run">New points and fit</button></p>
  <canvas id="plot" width="480" height="360"></canvas>
  <p id="status"></p>

  <script type="module">
    // The `web` build: call the default export once before using any class.
    import init, { KMeansModel } from "../pkg-web/tpt_ml_proven_wasm.js";

    const colours = ["#0a84ff", "#ff9f0a", "#30d158", "#bf5af2", "#ff453a", "#64d2ff", "#ffd60a", "#8e8e93"];
    const canvas = document.getElementById("plot");
    const context = canvas.getContext("2d");

    function randomPoints(count) {
      const points = new Float64Array(count * 2);
      for (let i = 0; i < count; i++) {
        const centre = i % 3;
        points[2 * i] = 0.2 + 0.3 * centre + 0.12 * (Math.random() - 0.5) * 2;
        points[2 * i + 1] = 0.3 + 0.2 * ((centre * 7) % 3) + 0.12 * (Math.random() - 0.5) * 2;
      }
      return points;
    }

    function draw(points, labels) {
      context.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < labels.length; i++) {
        context.fillStyle = colours[labels[i] % colours.length];
        context.beginPath();
        context.arc(points[2 * i] * canvas.width, (1 - points[2 * i + 1]) * canvas.height, 5, 0, 2 * Math.PI);
        context.fill();
      }
    }

    function run(points) {
      const k = Math.max(1, Math.min(8, Number(document.getElementById("k").value) || 3));
      const model = new KMeansModel({ nClusters: k, seed: 7 });
      model.fit(points, 2);
      draw(points, model.labels);
      document.getElementById("status").textContent =
        `${points.length / 2} points, ${k} clusters, inertia ${model.inertia.toFixed(3)}, ${model.nIter} iterations`;
    }

    await init();
    let points = randomPoints(240);
    run(points);
    document.getElementById("run").addEventListener("click", () => {
      points = randomPoints(240);
      run(points);
    });
  </script>
</body>
</html>
